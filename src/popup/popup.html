<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>screink</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>screink</h1>

    <p>
      画面共有に写っているURLやQRコードを読み取ります。照準モードに入って、読み取りたい場所を指してください。
    </p>

    <button id="start" type="button">照準モードを開始</button>

    <p class="status" id="status" role="status"></p>

    <hr />

    <h2>照準モード中の操作</h2>
    <ul>
      <li>クリック、または <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> で位置を指定して <kbd>Enter</kbd></li>
      <li><kbd>Shift</kbd> を押しながらの矢印キーで 1px ずつ微調整</li>
      <li><kbd>Esc</kbd> で解除</li>
    </ul>

    <p class="note">
      ショートカットキー <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> でも開始・解除できます。
    </p>

    <hr />

    <p><a href="../options/options.html" target="_blank">設定を開く</a></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
