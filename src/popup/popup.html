<!doctype html>
<!--
  文字列は既定言語（英語）を直書きし、読み込み時に chrome.i18n の文言へ
  差し替える（../shared/i18n.js）。空要素にして実行時に埋める方式は、
  スクリプトが動かなかったときに何も読めないページになるため採らない。
  lang も差し替え時に実際の表示言語へ合わせる。
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screink</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1 data-i18n="extName">screink</h1>

    <button id="start" type="button" data-i18n="popupStart">Enter aim mode</button>

    <p class="status" id="status" role="status"></p>

    <hr />

    <h2 data-i18n="popupHowTo">In aim mode</h2>

    <dl class="keys">
      <dt><kbd data-i18n="keyClick">Click</kbd></dt>
      <dd data-i18n="howToClick">Read what you pointed at</dd>

      <dt><kbd data-i18n="keyArrows">←↑↓→</kbd></dt>
      <dd data-i18n="howToMove">Move the crosshair</dd>

      <dt><kbd data-i18n="keyShiftArrows">Shift + ←↑↓→</kbd></dt>
      <dd data-i18n="howToFine">Move the crosshair one pixel at a time</dd>

      <dt><kbd data-i18n="keyEnter">Enter</kbd></dt>
      <dd data-i18n="howToEnter">Read at the crosshair</dd>

      <dt><kbd data-i18n="keyEsc">Esc</kbd></dt>
      <dd data-i18n="howToEsc">Leave aim mode</dd>
    </dl>

    <!-- 実際の割り当ては popup.js が chrome.commands から取って差し替える -->
    <p class="note" id="shortcut">You can assign a keyboard shortcut of your choosing for entering and leaving aim mode.</p>

    <hr />

    <p>
      <a href="../options/options.html" target="_blank" data-i18n="popupOpenOptions">Options</a>
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
